<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>

{% block title %}
Cooperativa Río Tambo
{% endblock %}

</title>


<link rel="stylesheet"
href="{{ url_for('static', filename='css/output.css') }}">


</head>


<body class="bg-[#f8f5ed]">


<header class="bg-white shadow-sm">


<nav class="max-w-7xl mx-auto px-10 py-5 flex items-center justify-between">


<a href="/">

<img
src="{{ url_for('static',filename='img/logo.png') }}"
class="w-28 h-auto"
alt="Logo Río Tambo">

</a>



<div id="main-nav" class="flex gap-12 text-[#3e2723] text-xl font-medium transition-transform duration-300">


<a href="/" class="hover:text-yellow-700 transition">
INICIO
</a>


<a href="/productos" class="hover:text-yellow-700 transition">
PRODUCTOS
</a>


<a href="/nosotros" class="hover:text-yellow-700 transition">
NOSOTROS
</a>


<a href="/contacto" class="hover:text-yellow-700 transition">
CONTACTO
</a>


</div>



<div class="flex items-center gap-6">

<div class="relative flex items-center">

<form action="/buscar" method="get" id="search-form"
      class="absolute right-9 top-1/2 -translate-y-1/2 h-9 rounded-full border border-gray-200 bg-white shadow-sm overflow-hidden transition-all duration-300 ease-in-out w-0 opacity-0 pointer-events-none">
<input type="text" name="q" placeholder="Buscar productos..."
       class="h-full w-64 px-4 text-sm text-[#3e2723] outline-none bg-transparent">
</form>

<button type="button"
        onclick="toggleSearch()"
        id="search-toggle-btn"
        class="hover:opacity-70 transition cursor-pointer relative z-10"
        aria-label="Buscar"
        aria-expanded="false">
<img src="{{url_for('static',filename='img/iconos/search.png')}}" class="w-7 h-7">
</button>

</div>

<button type="button" class="hover:opacity-70 transition cursor-pointer" aria-label="Carrito de compras">
<img src="{{url_for('static',filename='img/iconos/cart.png')}}" class="w-7 h-7">
</button>

<button type="button" class="hover:opacity-70 transition cursor-pointer" aria-label="Cambiar idioma">
<img src="{{url_for('static',filename='img/iconos/peru.png')}}" class="w-7 h-7">
</button>

</div>

<script>
function toggleSearch() {
  const form = document.getElementById('search-form');
  const btn = document.getElementById('search-toggle-btn');
  const nav = document.getElementById('main-nav');
  const isOpen = form.classList.contains('w-64');

  if (isOpen) {
    form.classList.remove('w-64', 'opacity-100', 'pointer-events-auto');
    form.classList.add('w-0', 'opacity-0', 'pointer-events-none');
    nav.classList.remove('-translate-x-[140px]', 'pointer-events-none');
    btn.setAttribute('aria-expanded', 'false');
  } else {
    form.classList.remove('w-0', 'opacity-0', 'pointer-events-none');
    form.classList.add('w-64', 'opacity-100', 'pointer-events-auto');
    nav.classList.add('-translate-x-[140px]', 'pointer-events-none');
    btn.setAttribute('aria-expanded', 'true');
    form.querySelector('input').focus();
  }
}
</script>



</nav>


</header>



<main>

{% block content %}

{% endblock %}

</main>



<footer class="bg-[#2f1f12] text-white mt-20">


<div class="max-w-7xl mx-auto px-16 py-14">


<div class="grid md:grid-cols-2 gap-10">


<div class="flex items-center gap-8">


<img
src="{{url_for('static',filename='img/logo.png')}}"
class="w-32">


<div>


<h3 class="text-3xl font-bold">

Cooperativa Agraria Cafetalera
<br>
Río Tambo Ltda.

</h3>


<p class="text-xl mt-5">

Café peruano, calidad que transforma.

</p>


</div>


</div>



<div>


<h3 class="text-4xl font-bold text-center">

Síguenos

</h3>


<div class="flex justify-center gap-10 mt-10">


<img src="{{url_for('static',filename='img/iconos/facebook.png')}}" class="w-12">


<img src="{{url_for('static',filename='img/iconos/instagram.png')}}" class="w-12">


<img src="{{url_for('static',filename='img/iconos/whatsapp.png')}}" class="w-12">


<img src="{{url_for('static',filename='img/iconos/gmail.png')}}" class="w-12">


</div>


</div>


</div>


<div class="border-t border-white/20 mt-10 pt-8 flex justify-between">


<p>
© 2026 Cooperativa Agraria Cafetalera Río Tambo Ltda.
</p>


<a href="#">
Privacidad
</a>


</div>


</div>


</footer>


</body>

</html>
