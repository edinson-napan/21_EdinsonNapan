<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Río Tambo{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#FAF8F5] text-[#1F150C] flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <header class="bg-white border-b border-gray-100 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
            
            <a href="/" class="flex items-center">
                <img src="{{ url_for('static', filename='img/logo.png') }}" 
                     alt="Logo CAIIC" 
                     class="h-12 w-auto object-contain">
            </a>
            
            <nav class="hidden md:flex items-center space-x-10 text-sm font-bold tracking-wider text-black">
                <a href="/" class="hover:text-[#8B5E34] transition uppercase">Inicio</a>
                <a href="/productos" class="hover:text-[#8B5E34] transition uppercase">Productos</a>
                <a href="/nosotros" class="hover:text-[#8B5E34] transition uppercase">Nosotros</a>
                <a href="/contacto" class="hover:text-[#8B5E34] transition uppercase">Contacto</a>
            </nav>

        </div>
    </header>

    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#1F150C] text-gray-300 py-8 border-t border-[#3A281A]">
        <div class="max-w-6xl mx-auto px-6 text-center text-sm">
            <p>&copy; 2026 CAIIC - Río Tambo. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
